# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install fixture and extension dependencies
        run: pip install .[gym] "maturin>=1,<2" numpy
      - name: Check generated fixtures
        run: |
          python rust/tools/export_topology.py --check
          python rust/tools/export_fixtures.py --check
          python rust/tools/export_gym_catalogue.py --check
      - name: Check Rust workspace
        run: |
          cargo fmt --all --manifest-path rust/Cargo.toml -- --check
          cargo clippy --workspace --all-targets --manifest-path rust/Cargo.toml -- -D warnings
          cargo test --workspace --manifest-path rust/Cargo.toml
      - name: Smoke-test optional Python extension
        run: |
          python -m maturin build --release --manifest-path rust/crates/python/Cargo.toml --out rust/target/wheels
          pip install --force-reinstall rust/target/wheels/*.whl
          python -m unittest discover -s rust/crates/python/tests -v

  build-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build the UI Docker image
        run: docker build ui/ -t bcollazo/catanatron-react-ui:latest
      - name: Build the Server Docker image
        run: docker build . -f Dockerfile.web -t bcollazo/catanatron-server:latest
      # - name: Build the Paperspace Docker image
      #   run: docker build . -f Dockerfile.paperspace -t bcollazo/paperspace-rl

  build-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: catanatron
          POSTGRES_PASSWORD: victorypoint
          POSTGRES_DB: catanatron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catanatron -d catanatron_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CATANATRON_TEST_DATABASE_URL: postgresql://catanatron:victorypoint@127.0.0.1:5432/catanatron_test
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # caching pip dependencies
      - name: Install core
        run: | # TODO: Move to python -m build and an automated release(?)
          pip install .
      - name: Run sample catanatron-play
        run: |
          catanatron-play --players=R,W,F,AB:2 --num=2
      - name: Test Custom Bot
        run: |
          catanatron-play --bot examples/custom_player.py --players=F,FooPlayer --num=1
      - name: Test Custom Accumulator
        run: |
          catanatron-play --accumulator examples/custom_accumulator.py --players=F,R --num=1
      - name: Test Library Example
        run: |
          python -W error examples/library_example.py
      - name: Install Gym
        run: |
          pip install .[gym]
      - name: Test Gym Inline
        run: |
          python -c "import gymnasium; import catanatron.gym; env = gymnasium.make('catanatron/Catanatron-v0')"
      - name: Test README.md sample (and fail even on warnings)
        run: |
          python -W error examples/gym_example.py && \
          python -W error examples/gym_vectorized_example.py
      - name: Install the rest of the dependencies
        run: |
          pip install .[web,dev]
      - name: Lint with black
        run: |
          black catanatron --check
          black catanatron_experimental --check
      - name: Test with pytest
        run: |
          coverage run --source=catanatron -m pytest tests/
      - name: Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          coveralls --service=github

  build-ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Find Node.js version
        id: node-version
        run: echo "node-version=$(cat ui/.nvmrc)" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
      - run: npm ci
        working-directory: ./ui
      - run: npm test -- --run
        working-directory: ./ui
      - run: npm run build
        working-directory: ./ui
